# Publie le plugin IAM Certifications : à chaque tag « vX.Y.Z », construit
# iam-certifications.zip et l'attache à une Release GitHub. Les sites qui ont
# le plugin installé voient la mise à jour dans WordPress (Plugin Update Checker).
#
# Déployer :  git tag v1.4.1 && git push origin v1.4.1
# (le numéro du tag doit être celui de « Version: » dans iam-certifications.php)

name: Release du plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier que le tag correspond à la version du plugin
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' iam-certifications/iam-certifications.php | awk '{print $NF}')
          CONST=$(grep -m1 -oE "IAM_CERT_VERSION', '[^']+'" iam-certifications/iam-certifications.php | grep -oE "[0-9][^']*")
          echo "Tag : $TAG — en-tête : $HEADER — constante : $CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Le tag v$TAG ne correspond pas à la version du plugin ($HEADER / $CONST)."
            exit 1
          fi

      - name: Vérifier la syntaxe PHP
        run: find iam-certifications -name '*.php' -not -path '*/lib/*' -print0 | xargs -0 -n1 php -l

      - name: Construire le ZIP
        run: |
          rm -f iam-certifications.zip
          zip -rq iam-certifications.zip iam-certifications -x '*.DS_Store'
          unzip -l iam-certifications.zip | tail -1

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" iam-certifications.zip \
            --title "IAM Certifications $GITHUB_REF_NAME" \
            --generate-notes
